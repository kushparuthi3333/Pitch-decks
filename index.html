<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Decks</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f10;
    color: #f2f2f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap {
    max-width: 480px;
    width: 100%;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 6px;
  }
  p.sub {
    color: #999;
    font-size: 0.9rem;
    margin: 0 0 28px;
  }
  .deck-link {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #1a1a1c;
    border: 1px solid #2a2a2d;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .deck-link:hover {
    border-color: #555;
    transform: translateY(-1px);
  }
  .deck-name {
    font-size: 1rem;
    font-weight: 500;
  }
  .arrow {
    float: right;
    color: #666;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Merchant Pitch Decks</h1>
    <p class="sub">Select a deck below.</p>

    <a class="deck-link" href="/the-pink-foundry">
      <span class="deck-name">The Pink Foundry</span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="deck-link" href="/pleated-story">
      <span class="deck-name">Pleated Story</span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="deck-link" href="/the-gut-story">
      <span class="deck-name">The Gut Story</span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="deck-link" href="/nashira">
      <span class="deck-name">Nashira</span>
      <span class="arrow">&rarr;</span>
    </a>
  </div>
</body>
</html>
